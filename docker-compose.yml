name: tswow

x-tswow-image: &tswow-image
  image: ghcr.io/ktrevis/tswow:${TSWOW_IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
  platform: linux/amd64

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${TSWOW_DB_PASSWORD:?Set TSWOW_DB_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - tswow
    ports:
      - "127.0.0.1:3306:3306"

  tswow:
    <<: *tswow-image
    container_name: tswow
    restart: unless-stopped
    tty: true
    stdin_open: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TSWOW_DB_HOST: mysql
      TSWOW_DB_PORT: 3306
      TSWOW_DB_USER: root
      TSWOW_DB_PASSWORD: ${TSWOW_DB_PASSWORD:?Set TSWOW_DB_PASSWORD in .env}
      TSWOW_CLIENT_PATH: /client
      TSWOW_LAUNCHER_PORT: 3726
      LD_LIBRARY_PATH: /opt/tswow/install/bin/trinitycore/RelWithDebInfo:/opt/tswow/install/bin/libraries/RelWithDebInfo
    ports:
      - "3724:3724"
      - "8085:8085"
      - "7878:7878"
      - "3726:3726"
    volumes:
      - ./runtime:/var/lib/tswow
      - ${WOW_CLIENT_PATH:?Set WOW_CLIENT_PATH in .env}:/client
      - ./runtime/launcher-packages:/opt/tswow/install/package
    networks:
      - tswow

  tswow-mcp:
    container_name: tswow-mcp
    <<: *tswow-image
    profiles:
      - tools
    stdin_open: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TSWOW_DB_HOST: mysql
      TSWOW_DB_PORT: 3306
      TSWOW_DB_USER: root
      TSWOW_DB_PASSWORD: ${TSWOW_DB_PASSWORD:?Set TSWOW_DB_PASSWORD in .env}
      TSWOW_STATE_DIR: /var/lib/tswow
      TSWOW_SKIP_RUNTIME_SEED: "1"
      LD_LIBRARY_PATH: /opt/tswow/install/bin/trinitycore/RelWithDebInfo:/opt/tswow/install/bin/libraries/RelWithDebInfo
    command:
      - node
      - /opt/tswow/mcp/tswow-inspector/server.cjs
      - --ipaths=./
      - --dataset=/var/lib/tswow/modules/default/datasets/dataset
      - --datasetName=default.dataset
      - --clientPatch=/tmp/tswow-mcp-client
      - --readonly
      - --no-luaxml
    volumes:
      - ./runtime/modules:/var/lib/tswow/modules:ro
      - ./runtime/coredata:/var/lib/tswow/coredata:ro
    tmpfs:
      - /var/lib/tswow/config
    networks:
      - tswow

volumes:
  mysql-data:

networks:
  tswow:
